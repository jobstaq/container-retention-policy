name: Verify retention patch

on:
  push:
    branches: [fix-deletion-failure-reporting]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Smoke test patched Docker action
        uses: ./
        with:
          account: snok
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: container-retention-policy
          image-tags: retention-patch-smoke-no-matching-tags
          tag-selection: tagged
          cut-off: 1w
          dry-run: 'true'
