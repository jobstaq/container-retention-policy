name: Verify retention patch

on:
  push:
    branches: [fix-deletion-failure-reporting]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Smoke test patched Docker action
        uses: ./
        env:
          CRP_TEST: 'true'
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: unused
          cut-off: 1w
          dry-run: 'true'
